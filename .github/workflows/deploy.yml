name: CI/CD Deploy to VPS

# Запускать при пуше в main или master
on:
  push:
    branches: [ main, master ]

# Подавить предупреждение о Node.js 20 (опционально)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # Загружаем nvm (предполагается, что он установлен для root)
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              \. "$NVM_DIR/nvm.sh"
              nvm use default || echo "⚠️  Не удалось переключиться на default Node.js, используется системный"
            else
              echo "⚠️  nvm не найден, проверяем доступность npm..."
            fi

            # Проверяем, что npm теперь доступен
            command -v npm || { echo "❌ npm не найден!"; exit 1; }

            echo "🚀 Начинаем деплой для проекта ${{ secrets.PM2_NAME }}"
            cd ${{ secrets.PROJECT_PATH }}

            # Обновляем код из репозитория
            git fetch --all
            git pull origin main

            # Устанавливаем зависимости (только production)
            npm ci --omit=dev || npm install --omit=dev

            # Собираем проект
            npm run build

            # Работа с PM2
            if command -v pm2 &> /dev/null; then
                pm2 startOrReload ecosystem.config.js --update-env
                pm2 save
            else
                echo "⚠️  PM2 не найден, устанавливаю глобально..."
                npm install -g pm2
                pm2 start ecosystem.config.js
                pm2 save
            fi

            echo "✅ Деплой для ${{ secrets.PM2_NAME }} завершен успешно!"