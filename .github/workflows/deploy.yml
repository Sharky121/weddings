name: CI/CD Deploy to VPS

# Событие, которое запускает процесс — пуш в ветку main
on:
  push:
    branches: [ main ] #
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем код из репозитория на виртуальную машину GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Подключаемся к VPS по SSH и выполняем команды
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Эта часть выполняется прямо на твоем сервере!
            set -e # Прервать скрипт, если какая-то команда завершится ошибкой

            echo "🚀 Начинаем деплой для проекта ${{ secrets.PM2_NAME }}"

            # Переходим в папку проекта
            cd ${{ secrets.PROJECT_PATH }}

            # Сохраняем текущую версию package-lock на случай отката (опционально)
            # cp package-lock.json package-lock.backup.json || true

            # Тянем последние изменения из Git
            git fetch --all
            git pull origin main # или master, смотря как называется твоя ветка

            # Устанавливаем зависимости (игнорируем dev-зависимости для продакшена)
            # Используем npm ci для быстрой и чистой установки по lock-файлу
            npm ci --omit=dev || npm install --omit=dev

            # Собираем проект
            npm run build

            # Запускаем или перезапускаем процесс в PM2
            # Используем startOrReload, который опирается на ecosystem.config.js
            if command -v pm2 &> /dev/null; then
                pm2 startOrReload ecosystem.config.js --update-env
                pm2 save
            else
                echo "⚠️ PM2 не найден, устанавливаю..."
                npm install -g pm2
                pm2 start ecosystem.config.js
                pm2 save
            fi

            echo "✅ Деплой для ${{ secrets.PM2_NAME }} завершен успешно!"
